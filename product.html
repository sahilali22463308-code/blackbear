<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.png"><title>Product — BlackBear.pk</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111}.nav{height:74px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 6%}.logo{display:flex;align-items:center;gap:10px;font-weight:bold;letter-spacing:2px}.logo img{width:42px;height:42px;border-radius:50%}a{text-decoration:none;color:inherit}.page{padding:60px 7%;display:grid;grid-template-columns:1fr 1fr;gap:70px}.photo{background:#f2f2f2;aspect-ratio:4/5}.photo img{width:100%;height:100%;object-fit:cover}.small{font-size:11px;letter-spacing:2px;color:#666}.title{font-size:44px;margin:15px 0}.price{font-size:20px;margin:20px 0}.sizes{display:flex;gap:10px;margin:15px 0 30px}.size{border:1px solid #bbb;background:#fff;padding:12px 20px;cursor:pointer}.size.active{background:#111;color:#fff}.button{border:0;background:#111;color:#fff;padding:16px 24px;font-weight:bold;cursor:pointer}.wa{display:inline-block;margin-left:10px;padding:15px 20px;border:1px solid #111}@media(max-width:750px){.page{grid-template-columns:1fr;gap:35px}.title{font-size:34px}}
</style></head><body><header class="nav"><a class="logo" href="index.html"><img src="assets/logo.png">BLACKBEAR.PK</a><a href="shop.html">← Shop</a></header><main class="page" id="app"></main><script src="js/config.js"></script><script src="js/store.js"></script><script>
const demos={demo1:{name:'Classic White Tailored Shirt',price:2000,image_url:'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=900&q=85',description:'A clean, timeless tailored shirt.',sizes:['S','M','L','XL']},demo2:{name:'Signature Black Shirt',price:2400,image_url:'https://images.unsplash.com/photo-1621072156002-e2fccdc0b176?auto=format&fit=crop&w=900&q=85',description:'Sharp black shirt for everyday premium style.',sizes:['S','M','L','XL']},demo3:{name:'Oxford Blue Shirt',price:2200,image_url:'https://images.unsplash.com/photo-1598032895397-b9472444bf93?auto=format&fit=crop&w=900&q=85',description:'Classic Oxford-inspired blue shirt.',sizes:['S','M','L','XL']}};
(async()=>{const id=new URLSearchParams(location.search).get('id');let products=await BlackBearStore.getProducts();let p=products.find(x=>x.id===id)||demos[id]||products[0]||demos.demo1;let selected=p.sizes?.[1]||'M';document.getElementById('app').innerHTML=`<div class="photo"><img src="${p.image_url||'assets/logo.png'}"></div><section><div class="small">BLACKBEAR / SHIRT</div><h1 class="title">${p.name}</h1><div class="price">PKR ${Number(p.price).toLocaleString()}</div><p>${p.description||''}</p><b>Select size</b><div class="sizes">${(p.sizes||['S','M','L','XL']).map(s=>`<button class="size ${s===selected?'active':''}" data-size="${s}">${s}</button>`).join('')}</div><button class="button" id="cart">ADD TO CART</button><a class="wa" id="wa" target="_blank">ORDER ON WHATSAPP</a></section>`;document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{selected=b.dataset.size;document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('cart').onclick=()=>{localStorage.setItem('blackbear_cart',JSON.stringify([{...p,selectedSize:selected,qty:1}]));alert('Added to cart. Checkout page will be connected next.');};document.getElementById('wa').href='https://wa.me/?text='+encodeURIComponent('Hello BlackBear, I want '+p.name+' (Size '+selected+'). Price: PKR '+p.price);})().catch(e=>alert(e.message));
</script></body></html>
