<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.png"><title>Shop Shirts — BlackBear.pk</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111;background:#fff}a{text-decoration:none;color:inherit}.nav{height:74px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;background:#fff;z-index:5}.logo{font-weight:800;letter-spacing:2px;display:flex;gap:10px;align-items:center}.logo img{width:42px;height:42px;border-radius:50%}.links{display:flex;gap:28px;font-size:12px;text-transform:uppercase;letter-spacing:1.5px}.wrap{padding:60px 6%}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.head h1{font-size:46px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{position:relative}.pic{aspect-ratio:4/5;background:#eee;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;transition:.4s}.card:hover img{transform:scale(1.03)}.info{padding:13px 2px}.info h3{margin:0 0 6px;font-size:15px}.price{font-size:14px}.badge{position:absolute;z-index:2;background:#fff;padding:7px 9px;margin:12px;font-size:10px;letter-spacing:1px;text-transform:uppercase}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.links{display:none}.grid{grid-template-columns:1fr 1fr}.head h1{font-size:34px}}
</style></head><body><header class="nav"><a class="logo" href="index.html"><img src="assets/logo.png"><span>BLACKBEAR.PK</span></a><nav class="links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="admin.html">Admin</a></nav><div>🛒 <span id="count">0</span></div></header><main class="wrap"><div class="head"><div><small>BLACKBEAR / COLLECTION</small><h1>All Shirts</h1></div></div><div class="grid" id="grid"></div></main><script src="js/config.js"></script><script src="js/store.js"></script><script>
const fallback=[{id:'demo1',name:'Classic White Tailored Shirt',price:2000,image_url:'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=900&q=85',badge:'New'},{id:'demo2',name:'Signature Black Shirt',price:2400,image_url:'https://images.unsplash.com/photo-1621072156002-e2fccdc0b176?auto=format&fit=crop&w=900&q=85'},{id:'demo3',name:'Oxford Blue Shirt',price:2200,image_url:'https://images.unsplash.com/photo-1598032895397-b9472444bf93?auto=format&fit=crop&w=900&q=85',badge:'Bestseller'}];
(async()=>{let p=await BlackBearStore.getProducts();if(!p.length)p=fallback;document.getElementById('grid').innerHTML=p.map(x=>`<a class="card" href="product.html?id=${x.id}">${x.badge?`<span class="badge">${x.badge}</span>`:''}<div class="pic"><img src="${x.image_url||'assets/logo.png'}" alt="${x.name}"></div><div class="info"><h3>${x.name}</h3><div class="price">PKR ${Number(x.price).toLocaleString()}</div></div></a>`).join('')})().catch(e=>alert(e.message));
</script></body></html>
